[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
xailens_lock = "6urQa7RwSR1nW9tbYkGpaLznWL7WuFSmGHmwJZWcXTA9"

[programs.localnet]
xailens_lock = "6urQa7RwSR1nW9tbYkGpaLznWL7WuFSmGHmwJZWcXTA9"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.test.ts"

# Local validator ports. Port 8000 (the default gossip port) is often taken on
# WSL2 and macOS, so the test validator uses a higher range.
[test.validator]
bind_address = "127.0.0.1"
gossip_port = 8010
dynamic_port_range = "8020-8120"
startup_wait = 20000

# Load the program as *upgradeable* with the test wallet as upgrade authority,
# because `initialize` only accepts the upgrade authority. A plain
# `--bpf-program` load has no upgrade authority and the test would fail.
[[test.genesis]]
address = "6urQa7RwSR1nW9tbYkGpaLznWL7WuFSmGHmwJZWcXTA9"
program = "target/deploy/xailens_lock.so"
upgradeable = true
